name: Flutter & Supabase Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    name: Setup and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Initialize Docker
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Step 3: Start the local Supabase containers
      - name: Start Supabase Local Stack
        run: supabase start

      # Step 4: Install the Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      # Step 5: Fetch Flutter project dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 6: Analyze code quality
      - name: Analyze Code
        run: flutter analyze

      # Step 7: Run tests
      - name: Run Flutter Tests
        env:
          SUPABASE_URL: 'https://hjvahwgljwbceonwzyck.supabase.co/'
          SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_MSnsDi7Oan_VdM-6RAvuoQ_CCdhlIGG' 
        run: flutter test
